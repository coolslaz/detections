title: Credential dumping via reg.exe SAM save or ntds.dit access
id: c62f3a4c-535a-4b95-a4ec-01e479a0b938
status: stable
description: Detects attempts to access or create copies of the Active Directory 'ntds.dit'
  database or the Windows Security Account Manager (SAM) registry hive using
  unauthorized processes. Attackers often target these files to extract credential
  hashes from Domain Controllers or local systems.
author: detections.ai
tags:
    - attack.credential_access
    - attack.t1003.002
    - attack.t1003.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_sam:
        Image|endswith: '\reg.exe'
        CommandLine|contains|all:
            - 'save'
            - 'HKLM\SAM'
    selection_ntds_proc:
        CommandLine|contains: 'ntds.dit'
    selection_ntds_file:
        Image|endswith: '\system32\lsass.exe'
        TargetFilename|endswith: '\Windows\NTDS\ntds.dit'
    filter_legit_image:
        Image|endswith:
            - '\ntdsutil.exe'
            - '\dsdbutil.exe'
            - '\wbadmin.exe'
            - '\esentutl.exe'
            - '\MsMpEng.exe'
            - '\vssadmin.exe'
            - '\wbengine.exe'
            - '\VeeamAgent.exe'
            - '\nbwin.exe'
            - '\ShadowProtectSvc.exe'
    filter_legit_parent:
        ParentImage|endswith:
            - '\ntdsutil.exe'
            - '\dsdbutil.exe'
            - '\wbadmin.exe'
            - '\wbengine.exe'
            - '\vssadmin.exe'
            - '\VeeamAgent.exe'
            - '\MsMpEng.exe'
    condition: (selection_sam or selection_ntds_proc or selection_ntds_file) and not (filter_legit_image or filter_legit_parent)
level: high
falsepositives:
    - 'Legitimate backup or imaging software not covered by the allowlist (e.g. custom backup agents)'
    - 'Administrative troubleshooting scripts that access these paths but are not in the allowlist'
    - 'Security agents performing scheduled AD database integrity checks'