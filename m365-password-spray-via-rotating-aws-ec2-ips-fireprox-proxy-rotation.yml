title: M365 Password Spray via Rotating AWS EC2 IPs (FireProx Proxy Rotation)
id: 82712b2c-d9cf-4b89-bf4a-1db2721fd969
description: |
  Detects the TeamFiltration/UNK_CondorFiltration spray signature: a large
  number of distinct target UserPrincipalNames within a single tenant, each
  receiving only a handful of sign-in attempts, spread across many distinct
  AWS EC2-hosted source IPs/regions within a short time window. Individual
  sign-ins from AWS-hosted IP ranges (VPN gateways, corporate cloud proxies,
  remote contractors) are not flagged on their own; the rule requires both
  the account-fanout and the IP-rotation dimensions to co-occur for the same
  tenant in the same window.
author: Arnold Chan
date: '2026-09-27'
modified: '2026-09-27'
logsource:
    product: azure
    service: signinlogs
detection:
    selection:
        IpAddress|cidr:
            - '3.101.0.0/16'
            - '18.144.76.0/24'
            - '13.52.201.0/24'
        ResultType:
            - '50126'
            - '50053'
            - '50074'
            - '0'
    condition: selection
    timeframe: 30m
# Note: Advanced aggregation logic below requires backend-specific correlation support
# condition_accounts: selection | count(UserPrincipalName) by TenantId > 20
# condition_ips: selection | count(IpAddress) by TenantId > 5
# condition_low_attempts: selection | count(IpAddress) by UserPrincipalName <= 3
falsepositives:
    - "Legitimate use of AWS-hosted corporate VPN gateways or SaaS integration services with static AWS-region egress IPs, provided the fanout across many distinct accounts and many distinct IPs within the tenant does not also occur"
level: high
fields:
    - UserPrincipalName
    - IpAddress
    - ResultType
    - AppDisplayName
    - TenantId