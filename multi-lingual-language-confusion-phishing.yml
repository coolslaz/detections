title: Multi-Lingual Language-Confusion Phishing
id: 9a3c9b74-547e-4b68-b7c4-c2c55e900c3b
status: experimental
description: Detects phishing emails that mix writing systems or scripts in the Subject line,
  combined with phishing vocabulary.
author: Arnold Chan
level: medium
logsource:
    category: email
    product: office365
detection:
    selection_homoglyph:
        Subject|re: '(?i)(?:[A-Za-z]+[\u0400-\u04FF\u0370-\u03FF]|[\u0400-\u04FF\u0370-\u03FF]+[A-Za-z])'
    selection_mixed_script:
        Subject|re: '(?i)[A-Za-z].*[\u0400-\u04FF\u0370-\u03FF\u0600-\u06FF\u0590-\u05FF\u4E00-\u9FFF]'
    selection_phish_terms:
        Subject|contains:
            - 'password'
            - 'login'
            - 'verify'
            - 'urgent'
            - 'account'
    condition: (selection_homoglyph or selection_mixed_script) and selection_phish_terms
tags:
  - attack.t1566
falsepositives:
  - 'Bilingual/foreign-language subject lines that coincidentally also contain a
    generic word from the phishing-term list (password, login, verify, urgent,
    account) in an unrelated business context'
  - 'Sigma''s condition logic can''t apply a weighted score or brand-token allowlist
    the way the SPL/S1QL/CQL/CortexQL translations of this rule do — expect somewhat
    higher false positives here'
  - 'Newsletters or marketing platforms with localized subject lines that include one
    of the phishing terms'