title: "Replication Through Removable Media: USB Mount, Write, Execute"
id: d4f9c5a1-7e8e-4a6f-a5c2-1e9a2b5e9f8a
status: experimental
description: >
  Detects process creation events where the executed image path is on a removable
  drive letter (D: through I:), consistent with execution of a payload staged on
  removable/USB media (T1091).
  
  
  Known limitation: this platform's Sigma parser only accepts a single YAML
  document per rule, so the original three-stage correlation (mount -> file write
  -> process execution, linked via Sigma's multi-document `correlation:` feature)
  is not expressible here. This rule now detects only the final,
  highest-confidence stage (process execution from a removable drive letter) as a
  single-logsource rule. The mount and file-write stages have been dropped rather
  than silently merged.
author: Arnold Chan
level: high
tags:
  - attack.t1091
  - attack.initial_access
  - attack.lateral_movement
falsepositives:
  - Legitimate use of removable/USB media for software installation, data transfer,
    or portable applications by authorized personnel.
logsource:
  product: windows
  category: process_creation
detection:
  selection_process:
    Image|startswith:
      - "D:\\"
      - "E:\\"
      - "F:\\"
      - "G:\\"
      - "H:\\"
      - "I:\\"
  condition: selection_process
fields:
  - ComputerName