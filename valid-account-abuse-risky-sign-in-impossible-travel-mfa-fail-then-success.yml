title: Entra ID Valid Account Abuse Indicators
id: d2a6b2c4-4e92-4f91-8e58-693240e53a1a
status: experimental
description: Detects indicators of valid account abuse in Entra ID sign-in logs including MFA failures, impossible travel, and off-hours access.
logsource:
    product: azure
    service: entra_id
    category: signin_logs
detection:
    selection_mfa:
        ResultType: 0
        AuthenticationRequirement: 'multiFactorAuthentication'
    selection_travel:
        ResultType: 0
        LocationDetails_countryOrRegion|exists: true
    selection_hour:
        ResultType: 0
        TimeGenerated|endswith:
            - ' 00:'
            - ' 01:'
            - ' 02:'
            - ' 03:'
            - ' 04:'
            - ' 05:'
    selection_risk:
        RiskLevelDuringSignIn:
            - 'medium'
            - 'high'
        RiskState:
            - 'atRisk'
            - 'confirmedCompromised'
    condition: 2 of selection_*
level: high
tags:
    - attack.t1078
    - attack.t1078.004
author: detections.ai
falsepositives:
    - 'Users traveling internationally for legitimate business purposes.'
    - 'Users working in different time zones, especially those with flexible or irregular schedules.'
    - 'Users experiencing technical issues with MFA hardware tokens or mobile apps, leading to repeated failures.'
    - 'Automated service accounts or scripts running at unusual hours or from diverse locations.'